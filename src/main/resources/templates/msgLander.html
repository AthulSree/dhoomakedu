<html layout:decorate="~{base}">
<div layout:fragment="content">
    <!-- Inline styles to override bootstrap defaults and implement WhatsApp cosmic design -->
    <style>
        .chat-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: calc(100vh - 120px);
            padding: 10px;
        }

        .chat-container {
            display: flex;
            width: 100%;
            max-width: 1100px;
            height: 100%;
            background: rgba(10, 15, 28, 0.75);
            backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 25px rgba(99, 102, 241, 0.1);
            overflow: hidden;
        }

        /* Sidebar styling */
        .chat-sidebar {
            width: 340px;
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            background: rgba(15, 22, 40, 0.4);
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .app-title {
            font-family: 'Segoe UI', 'Inter', sans-serif;
            font-weight: 700;
            font-size: 1.4rem;
            color: #fff;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .highlight-chat {
            background: linear-gradient(135deg, #a5b4fc 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline;
        }

        .search-wrapper {
            position: relative;
        }

        .search-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px 15px 10px 40px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s;
        }

        .search-input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
        }

        .contact-list {
            flex: 1;
            overflow-y: auto;
        }

        /* Custom Scrollbar */
        .contact-list::-webkit-scrollbar,
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .contact-list::-webkit-scrollbar-thumb,
        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .contact-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .contact-item.active {
            background: rgba(99, 102, 241, 0.15);
            border-left: 4px solid #6366f1;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 1.1rem;
            position: relative;
            flex-shrink: 0;
        }

        .avatar.group-avatar {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
        }

        .status-dot {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            border: 2px solid #0f172a;
        }

        .status-dot.online {
            background: #10b981;
            box-shadow: 0 0 8px #10b981;
        }

        .status-dot.offline {
            background: #94a3b8;
        }

        .contact-details {
            flex: 1;
            min-width: 0;
        }

        .contact-name-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }

        .contact-name {
            font-weight: 600;
            color: #f8fafc;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .contact-time {
            font-size: 0.75rem;
            color: #64748b;
        }

        .contact-last-msg {
            font-size: 0.8rem;
            color: #94a3b8;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Main Chat Window */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(5, 8, 16, 0.4);
            position: relative;
        }

        .chat-placeholder {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #64748b;
            gap: 15px;
            text-align: center;
            padding: 40px;
        }

        .chat-placeholder i {
            font-size: 4rem;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .chat-header {
            padding: 15px 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(15, 22, 40, 0.6);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .chat-header-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .chat-header-name {
            font-weight: 600;
            color: #fff;
            font-size: 1.05rem;
        }

        .chat-header-status {
            font-size: 0.8rem;
            color: #10b981;
        }

        .chat-messages {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.03) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .message-bubble {
            max-width: 60%;
            padding: 10px 14px 8px 14px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.4;
            display: flex;
            flex-direction: column;
            gap: 4px;
            position: relative;
            animation: fadeInMessage 0.25s ease-out;
        }

        @keyframes fadeInMessage {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-bubble.outgoing {
            align-self: flex-end;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-bottom-right-radius: 4px;
            color: #f1f5f9;
        }

        .message-bubble.incoming {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom-left-radius: 4px;
            color: #f1f5f9;
        }

        .msg-sender {
            font-size: 0.75rem;
            font-weight: 700;
            color: #a5b4fc;
            margin-bottom: 2px;
        }

        .msg-type-tag {
            align-self: flex-start;
            font-size: 0.65rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .msg-type-tag.normal {
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
        }

        .msg-type-tag.docsquad {
            background: rgba(248, 113, 113, 0.2);
            color: #f87171;
        }

        .msg-type-tag.leave {
            background: rgba(251, 191, 36, 0.2);
            color: #fbbf24;
        }

        .msg-type-tag.confirm {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
        }

        /* Confirmation Box & Status */
        .confirmation-box {
            margin-top: 8px;
            padding: 8px 10px;
            background: rgba(15, 23, 42, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            font-size: 0.8rem;
        }

        .confirmation-title {
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .confirmation-actions {
            display: flex;
            gap: 8px;
            margin-top: 6px;
        }

        .btn-confirm-action {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 12px;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-confirm-ok {
            background: #10b981;
            color: #ffffff;
        }

        .btn-confirm-ok:hover {
            background: #059669;
            transform: translateY(-1px);
        }

        .btn-confirm-cancel {
            background: #ef4444;
            color: #ffffff;
        }

        .btn-confirm-cancel:hover {
            background: #dc2626;
            transform: translateY(-1px);
        }

        .confirmation-status-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.72rem;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 6px;
        }

        .confirmation-status-pill.ok {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.35);
        }

        .confirmation-status-pill.cancel {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.35);
        }

        .confirmation-status-pill.pending {
            background: rgba(148, 163, 184, 0.2);
            color: #94a3b8;
            border: 1px solid rgba(148, 163, 184, 0.35);
        }

        .group-conf-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-top: 6px;
        }

        .group-conf-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 2px 0;
            font-size: 0.73rem;
            color: #cbd5e1;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.05);
        }

        .group-conf-item:last-child {
            border-bottom: none;
        }

        .conf-time {
            font-size: 0.65rem;
            color: #64748b;
            margin-left: 4px;
        }

        .message-content {
            white-space: pre-wrap;
            word-break: break-word;
        }

        .message-time-row {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            margin-top: 2px;
        }

        .message-time {
            font-size: 0.7rem;
            color: #64748b;
        }

        .message-status-icon {
            font-size: 0.8rem;
            color: #6366f1;
        }

        /* Footer input styling */
        .chat-footer {
            padding: 20px 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(15, 22, 40, 0.6);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .chat-input-row {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .msg-type-select {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            border-radius: 12px;
            padding: 10px;
            outline: none;
            cursor: pointer;
            font-size: 0.9rem;
            width: 140px;
        }

        .msg-type-select option {
            background: #111827;
            color: #fff;
        }

        .chat-input-wrapper {
            flex: 1;
            position: relative;
        }

        .chat-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px 15px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            resize: none;
            max-height: 100px;
            height: 44px;
            transition: all 0.3s;
        }

        .chat-input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .send-message-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            border: none;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3);
        }

        .send-message-btn:hover {
            transform: scale(1.05);
            filter: brightness(1.1);
        }

        .send-message-btn:active {
            transform: scale(0.95);
        }

        .footer-info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: #64748b;
        }

        .char-counter {
            text-align: right;
        }
    </style>

    <div class="chat-wrapper">
        <div class="chat-container">
            <!-- Sidebar -->
            <div class="chat-sidebar">
                <div class="sidebar-header">
                    <h3 class="app-title"><span>🔮</span> <span>Kutti <span class="highlight-chat">Chat</span>han</span></h3>
                    <div class="search-wrapper">
                        <i class="fa fa-search search-icon"></i>
                        <input type="text" class="search-input" id="searchContacts" placeholder="Search chats...">
                    </div>
                </div>
                <div class="contact-list" id="contactList">
                    <!-- Loaded dynamically via AJAX -->
                    <div style="text-align: center; color: #64748b; margin-top: 50px;">
                        <i class="fa fa-spinner fa-spin" style="font-size: 1.5rem; margin-bottom: 10px;"></i>
                        <p>Syncing transmissions...</p>
                    </div>
                </div>
            </div>

            <!-- Chat Main -->
            <div class="chat-main" id="chatMain">
                <!-- Shown when no contact is selected -->
                <div class="chat-placeholder" id="chatPlaceholder">
                    <i class="fa-solid fa-message" style="font-size: 3.5rem; margin-bottom: 15px;"></i>
                    <h4>Select a contact to begin transmitting</h4>
                    <p style="font-size: 0.85rem; max-width: 300px; color: #64748b;">Direct messages trigger instant SSH popup alerts on target systems.</p>
                </div>

                <!-- Chat Header (Hidden by default) -->
                <div class="chat-header" id="chatHeader" style="display: none;">
                    <div class="chat-header-info">
                        <div class="avatar" id="chatHeaderAvatar">D</div>
                        <div>
                            <div class="chat-header-name" id="chatHeaderName">Unknown User</div>
                            <div class="chat-header-status" id="chatHeaderStatus">online</div>
                        </div>
                    </div>
                    <div>
                        <span style="color: #64748b; font-size: 0.8rem; font-family: monospace;" id="chatHeaderIp"></span>
                    </div>
                </div>

                <!-- Chat Messages thread (Hidden by default) -->
                <div class="chat-messages" id="chatMessages" style="display: none;">
                    <!-- Loaded dynamically -->
                </div>

                <!-- Chat Input footer (Hidden by default) -->
                <div class="chat-footer" id="chatFooter" style="display: none;">
                    <div class="chat-input-row">
                        <select class="msg-type-select" id="msgType" title="Message Type">
                            <option value="normal">Normal</option>
                            <option value="confirm">Confirmation (OK / Cancel)</option>
                            <option value="docsquad">DocSquad</option>
                            <option value="leave">Leave Portal</option>
                        </select>
                        <div class="chat-input-wrapper">
                            <textarea class="chat-input" id="messageInput" placeholder="Type a message..." maxlength="500"></textarea>
                        </div>
                        <button class="send-message-btn" id="sendMessageBtn" title="Transmit">
                            <i class="fa fa-paper-plane"></i>
                        </button>
                    </div>
                    <div class="footer-info-row">
                        <span>Press Enter to send (Shift + Enter for new line)</span>
                        <span class="char-counter" id="charCounter">0 / 500</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Pass current logged-in sender IP and context to JS -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        const clientIp = /*[[${clientIp}]]*/ '127.0.0.1';
        const senderName = /*[[${senderName}]]*/ 'Unknown Sender';
        /*]]>*/
    </script>
    <script th:src="@{/js/msgLander.js(v='2.1')}"></script>
</div>
</html>
